<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Net transfer spend since summer 2024</title>
  <desc id="desc">Liverpool 385 million pounds, Manchester City 371 million pounds, Arsenal 341 million pounds. Summer 2024 to summer 2026, including January windows.</desc>
  <rect width="1200" height="680" fill="#f8f6f1"/>
  <rect x="48" y="44" width="1104" height="592" rx="18" fill="#ffffff" stroke="#d8d5cd" stroke-width="2"/>

  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2.2" fill="#ad2330">THE LIVERPOOL BRIEF</text>
  <text x="92" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#242522">Net transfer spend since summer 2024</text>
  <text x="92" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#686861">Summer 2024 to summer 2026 · January windows included</text>

  <line x1="310" y1="252" x2="1055" y2="252" stroke="#dedbd3" stroke-width="1"/>
  <line x1="310" y1="252" x2="310" y2="548" stroke="#dedbd3" stroke-width="1"/>
