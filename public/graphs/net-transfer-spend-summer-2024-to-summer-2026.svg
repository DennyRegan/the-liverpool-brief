<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="title desc">
  <title id="title">Net transfer spend since summer 2024</title>
  <desc id="desc">Liverpool 385 million pounds, Manchester City 371 million pounds, Arsenal 341 million pounds. Summer 2024 to summer 2026, including January windows.</desc>
  <rect width="800" height="640" fill="#f8f6f1"/>
  <rect x="16" y="16" width="768" height="608" rx="16" fill="#ffffff" stroke="#d8d5cd" stroke-width="2"/>

  <text x="48" y="66" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#ad2330">THE LIVERPOOL BRIEF</text>
  <text x="48" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#242522">Net transfer spend since summer 2024</text>
  <text x="48" y="146" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#686861">Summer 2024 to summer 2026 · January windows included</text>

  <!-- Scale: £0m at x=48, £400m at x=668 (1.55px per £1m). Club names sit above their bars. -->
  <line x1="48" y1="228" x2="48" y2="508" stroke="#dedbd3" stroke-width="1"/>
  <line x1="203" y1="228" x2="203" y2="508" stroke="#ece9e2" stroke-width="1"/>
  <line x1="358" y1="228" x2="358" y2="508" stroke="#ece9e2" stroke-width="1"/>
  <line x1="513" y1="228" x2="513" y2="508" stroke="#ece9e2" stroke-width="1"/>
  <line x1="668" y1="228" x2="668" y2="508" stroke="#ece9e2" stroke-width="1"/>

  <circle cx="66" cy="198" r="18" fill="#c8102e"/>
  <text x="66" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">LFC</text>
  <text x="94" y="206" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242522">Liverpool</text>
  <rect x="48" y="228" width="596.75" height="48" rx="8" fill="#c8102e"/>
  <text x="656" y="261" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#242522">£385m</text>

  <circle cx="66" cy="314" r="18" fill="#6cabdd"/>
  <text x="66" y="319" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17324d">MC</text>
  <text x="94" y="322" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242522">Manchester City</text>
  <rect x="48" y="344" width="575.05" height="48" rx="8" fill="#6cabdd"/>
  <text x="635" y="377" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#242522">£371m</text>

  <circle cx="66" cy="430" r="18" fill="#ef0107"/>
  <text x="66" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">AFC</text>
  <text x="94" y="438" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242522">Arsenal</text>
  <rect x="48" y="460" width="528.55" height="48" rx="8" fill="#ef0107"/>
  <text x="588" y="493" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#242522">£341m</text>

  <text x="48" y="536" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#77776f">£0m</text>
  <text x="203" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#77776f">£100m</text>
  <text x="358" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#77776f">£200m</text>
  <text x="513" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#77776f">£300m</text>
  <text x="668" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#77776f">£400m</text>

  <text x="48" y="578" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#686861">Source: Sky Sports transfer-window records.</text>
  <text x="48" y="602" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#686861">Fees include potential add-ons; undisclosed fees excluded.</text>
</svg>
