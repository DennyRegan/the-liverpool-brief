  <line x1="868.75" y1="252" x2="868.75" y2="548" stroke="#ece9e2" stroke-width="1"/>
  <line x1="1055" y1="252" x2="1055" y2="548" stroke="#ece9e2" stroke-width="1"/>

  <text x="310" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#77776f">£0m</text>
  <text x="496.25" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#77776f">£100m</text>
  <text x="682.5" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#77776f">£200m</text>
  <text x="868.75" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#77776f">£300m</text>
  <text x="1055" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#77776f">£400m</text>

