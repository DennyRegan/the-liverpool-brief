  <text x="118" y="321" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">LFC</text>
  <text x="164" y="321" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#242522">Liverpool</text>
  <rect x="310" y="286" width="717.6" height="56" rx="9" fill="#c8102e"/>
  <text x="1045" y="322" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#242522">£385m</text>

  <circle cx="118" cy="404" r="30" fill="#6cabdd"/>
  <text x="118" y="411" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17324d">MC</text>
  <text x="164" y="411" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#242522">Manchester City</text>
